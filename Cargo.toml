[package]
name = "weaver-web"
version = "0.1.0"
# **Aligned to the workspace 2026-09-06, and the migration was not what this
# comment predicted.** It read that the move was real work because the sqlx
# and askama derives are where an edition move bites. They do not bite: with
# the edition set, `cargo check` and `cargo test` passed unchanged. What the
# move cost was twelve `collapsible_if` warnings against 2021's none, each
# collapsed into the let-chains 2024 stabilizes, and one `cargo fmt` run,
# whose 2024 rules reorder imports and rewrap long strings. The lockfile did
# not move. Recorded here rather than deleted because the estimate was the
# reason the act waited.
edition = "2024"
default-run = "weaver-web"
# **Explicit rather than inherited, because the licences disagree.** The
# workspace publishes nothing and carries UNLICENSED. This crate carries
# Apache-2.0 with its LICENSE file beside it. The suite's licence boundary
# is an open operator question, held rather than resolved by inheritance.
# **Held at `weaver-web-Spec` section 10**, which carries it again as of
# 2026-09-06: it stood at section 15 of the Spec this crate was written to
# and the rewrite dropped it, so this pointer named nothing until the
# edition act restored the election.
license = "Apache-2.0"
publish = false
description = "The WeaverTools suite's frontend: channel, lifecycle, and trace surfaces over weaver agents."

# **This crate's store is Postgres and it is not the workspace's only one.**
# A frontend holding its own store is ordinary. `weaver-state` carries
# `rusqlite` on by default, as the sqlx note below turns on, so the claim
# that nothing else in the workspace carries a database was false from that
# dependency's arrival. **Whether the tree now has a database, or whether
# this stays a property of one member, was the retired Spec's section 15
# election, and the rewrite dropped it.** The licence election stood beside
# it in that same section and was dropped too, then restored at section 10
# on 2026-09-06, which is the shape a restore takes here and is why the
# pointer eight lines above resolves and this one does not. No standing
# section holds this one, so restoring it is the operator's rather than
# this manifest's.
# **`passkeys` carries the WebAuthn library and its OpenSSL** (design section
# 2), on by default so the server builds, tests and runs as before; the
# server binary requires it, and the connectors, built for agent boxes, are
# built without it (CLAUDE.md gives the command and the measurement).
[features]
default = ["passkeys"]
passkeys = ["dep:webauthn-rs"]

[[bin]]
name = "weaver-web"
path = "src/bin/weaver-web.rs"
required-features = ["passkeys"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
askama = "0.14"
# **0.9 rather than 0.8, and the reason is the workspace rather than this
# crate.** On 0.8 the elected features resolved `sqlx-sqlite` into the graph,
# and that driver reached a `libsqlite3-sys` at a version `weaver-state`
# cannot share through rusqlite. Cargo permits one package linking `sqlite3`
# in a graph, so the two made the whole workspace unresolvable rather than
# only the crates that collide.
#
# **On 0.9 the driver is optional and these features do not enable it**, so
# it is absent from the built graph rather than present at a reconciled
# version: `cargo tree -p weaver-web` carries `sqlx-core`, `sqlx-macros`, and
# `sqlx-postgres` and no sqlite at all. The one `libsqlite3-sys` in the tree
# is reached through `weaver-state` and rusqlite alone, which `cargo tree -i
# libsqlite3-sys` shows as its only path. Nothing of `weaver-state` moved.
#
# The lock file still lists `sqlx-sqlite`, as it lists any optional
# dependency that resolves, and reading the lock for what is enabled is the
# error this comment first made.
# `json` joins 2026-10-01 for the register of agents (Spec 2.12): the tuple
# admin reported is a JSONB member, bound and read as `serde_json::Value`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bearer is hashed before it is stored or looked up, per Spec 2.8.
sha2 = "0.10"
# Act 11: a person's canonical name, Unicode's compatibility caseless form
# (design section 6), measured on 2026-10-07: caseless 0.2.2 implements D146
# with the full case folding of Unicode 16.0's CaseFolding.txt, and adds one
# crate, unicode-normalization and tinyvec being in the tree through sqlx.
caseless = "0.2"
unicode-normalization = "0.1"
# Every bearer the server issues is read from the operating system's random
# source (design section 6). getrandom directly, already in the tree through
# rand: the source itself, with no generator between it and the bearer.
getrandom = "0.4"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# **The link of Spec section 8 is mutual TLS with the server as its own
# authority**, added 2026-10-01 by the act that built the listener. `rustls`
# is the TLS implementation, `tokio-rustls` its async adapter, `rcgen` mints
# the authority and every client certificate, `rustls-pki-types` is the DER
# vocabulary the three share, and `rustls-pemfile` reads the PEM the authority
# stores and the client configs carry. **`ring` rather than the default
# `aws-lc-rs` provider**, for `rustls`, `tokio-rustls` and `rcgen` alike: one
# provider across the three, and `ring` builds with a C compiler alone where
# `aws-lc-rs` wants cmake on the build host, which the thinkpad seat does not
# carry. The default features are off so the unelected provider is absent
# from the graph rather than present and unused.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-pemfile = "2"
# Act 11's browser listener (src/listen.rs), all already in the tree and
# adding no crate (measured 2026-10-08): rustls-webpki, through rustls, for
# the certificate's name check; yasna, through rcgen, to read the
# certificate's validity period, where x509-parser would add thirteen crates;
# and url, through sqlx-core, the WHATWG URL Standard by which the configured
# origin is parsed and serialized as a browser does it.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
yasna = { version = "0.6", features = ["time"] }
time = "0.3"
url = "2.5.8"
# **The WebAuthn library, in the server binary alone** (design section 2):
# webauthn-rs 0.5 links OpenSSL's libcrypto, which the connectors, running on
# agent boxes, must not carry. The `passkeys` feature carries it, and only
# the server binary requires it.
# `danger-credential-internals` gives typed, read-only access to a stored
# passkey's counter, which the counter rule compares (design section 6) and
# the stable API does not expose; reading the serialized JSON by path instead
# would read a moved field as null, and so as zero, skipping the check.
webauthn-rs = { version = "0.5", optional = true, features = ["danger-credential-internals"] }
# `O_NOFOLLOW` for the client configs' staging files (Spec 8): a staging
# entry that is a symlink must refuse rather than be followed to a file
# another owner can read. Already in the graph through tokio.
libc = "0.2"

[dev-dependencies]
# A software authenticator for the passkey ceremonies' tests (act 11, PR 4b):
# its soft passkey adds six crates beyond what webauthn-rs brings, none of
# them in a build that is not a test's.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
# A paused clock for the orderly stop's retry (`time::pause`/`advance`): a
# feature of tokio, already in the tree, so no crate is added.
tokio = { version = "1", features = ["test-util"] }
# The link's tests mint an authority and client credentials under a directory
# that is removed when the test ends, so no key is left behind (Spec 8).
tempfile = "3"
# `oneshot` drives the router in a test without binding a port, which is
# what lets the Record surface's watch ask the real route for real HTML
# rather than calling the handler and trusting the wiring.
tower = { version = "0.5", features = ["util"] }
