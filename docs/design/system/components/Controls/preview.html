<!-- @dsCard group="Primitives" height=300 subtitle="Verb forms, a turn, inputs, and the caught-now / caught-at-load annotation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../components/bundle.css"></head><body style="padding:16px 20px">
<div class="grid two" style="gap:24px">
  <div class="stack" style="gap:12px">
    <div class="row">
      <form><button type="button" class="verb">show</button></form>
      <form><button type="button" class="verb">validate</button></form>
      <form><button type="button" class="verb" disabled>load</button></form>
      <form><button type="button" class="verb">unload</button></form>
      <form><button type="button" class="verb">stop</button></form>
      <form><button type="button" class="verb" disabled>save-point</button></form>
    </div>
    <p class="note read" style="margin:0">load: not in your roles &middot; save-point: above the ceiling. A verb that does not apply is disabled, not hidden.</p>
    <div class="field"><label for="t">Turn <span class="note">more than one person holds turn on hb-01: your turns interleave in its one conversation</span></label>
      <textarea id="t" rows="3">Continue from the last checkpoint and list what changed.</textarea></div>
    <div class="row"><button type="button" class="verb primary">Place the turn</button><button type="button">Secondary</button><button type="button" class="primary">Primary</button></div>
  </div>
  <div class="stack" style="gap:12px">
    <div class="field"><label for="box">box <span class="when now"></span></label><input id="box" type="text" value="thinkpad"></div>
    <div class="field"><label for="name">name <span class="when now"></span></label><input id="name" type="text" value="hb-01"></div>
    <div class="field"><label for="art">model artifact <span class="when load"></span></label><select id="art"><option>qwen3-8b-q4 (sha256 9f1c...)</option></select></div>
    <label class="row" style="gap:8px"><input type="checkbox" checked> turn <span class="note">on role operator</span></label>
  </div>
</div>
</body></html>
