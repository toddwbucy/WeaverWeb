<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}weaver-web{% endblock %}</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/sse.js"></script>
</head>
<body>
  <nav class="masthead">
    <span class="brand">weaver-web</span>
    <a href="/channels">channels</a>
    {% if is_admin %}
    <span class="navsep">admin:</span>
    <a href="/admin/lifecycle">lifecycle</a>
    {% for agent in nav_agents %}<a href="/admin/trace/{{ agent }}">trace:{{ agent }}</a>{% endfor %}
    {% endif %}
    <span class="who">{{ who }}{% if is_admin %} (admin){% endif %}</span>
  </nav>
  <main class="{% block mainclass %}{% endblock %}">
  {% block body %}{% endblock %}
  </main>
</body>
</html>
